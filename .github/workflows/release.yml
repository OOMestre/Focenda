name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0 or v0.1.0-beta.1)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Tests
        run: swift test

      - name: Determine Release Version
        id: check-prerelease
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ -z "$TAG_NAME" || "$TAG_NAME" == "main" || "$TAG_NAME" == "staging" ]]; then
            TAG_NAME="${{ github.event.inputs.version }}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          if [[ "$TAG_NAME" == *"beta"* || "$TAG_NAME" == *"rc"* || "$TAG_NAME" == *"alpha"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "app_name=Focenda Staging" >> $GITHUB_OUTPUT
            echo "bundle_identifier=com.oomestre.focenda.staging" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "app_name=Focenda" >> $GITHUB_OUTPUT
            echo "bundle_identifier=com.oomestre.focenda" >> $GITHUB_OUTPUT
          fi

      - name: Build Staging / Release Bundle
        env:
          FOCENDA_RELEASE_TAG: ${{ steps.check-prerelease.outputs.tag_name }}
          FOCENDA_APP_NAME: ${{ steps.check-prerelease.outputs.app_name }}
          FOCENDA_BUNDLE_IDENTIFIER: ${{ steps.check-prerelease.outputs.bundle_identifier }}
          FOCENDA_NO_OPEN: "1"
        run: ./scripts/build-staging.sh

      - name: Package App as ZIP
        env:
          FOCENDA_APP_NAME: ${{ steps.check-prerelease.outputs.app_name }}
        run: |
          cd dist
          zip -r -X ../Focenda-macOS.zip "${FOCENDA_APP_NAME}.app"

      - name: Package App as DMG
        env:
          FOCENDA_APP_NAME: ${{ steps.check-prerelease.outputs.app_name }}
        run: |
          DMG_ROOT="$(mktemp -d)"
          trap 'rm -rf "$DMG_ROOT"' EXIT
          ditto "dist/${FOCENDA_APP_NAME}.app" "$DMG_ROOT/${FOCENDA_APP_NAME}.app"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create -volname "$FOCENDA_APP_NAME" -srcfolder "$DMG_ROOT" -ov -format UDZO Focenda-macOS.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check-prerelease.outputs.tag_name }}
          name: Focenda ${{ steps.check-prerelease.outputs.tag_name }}
          prerelease: ${{ steps.check-prerelease.outputs.is_prerelease == 'true' }}
          files: |
            Focenda-macOS.zip
            Focenda-macOS.dmg
          generate_release_notes: true
